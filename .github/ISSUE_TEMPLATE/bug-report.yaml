name: Bug Report
description: File a bug report to help us improve Foundry Method
title: '[BUG] '
labels: bug
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report! Please fill out the information below to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of what the bug is
      placeholder: e.g., When I run fmad-build, it crashes during the review step
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the behavior
      placeholder: |
        1. Run 'npx skills add DavidBatoDev/fmad-method'
        2. Ask the fmad skill to run 'fmad setup'
        3. Run skill Y
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
      placeholder: The workflow should complete successfully
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened
      placeholder: The workflow crashed with error "..."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Add screenshots if applicable (paste images directly)
      placeholder: Paste any relevant screenshots here

  - type: dropdown
    id: module
    attributes:
      label: Which module is this for?
      description: Select the FMAD module this issue relates to
      options:
        - fmod-method - Delivery workflows and agents
        - fmod-core-tools - The fmad hub and standalone tools
        - Docs site or web bundles
        - Not sure / Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: FMAD Version
      description: Ask your agent for `fmad status`.
      placeholder: e.g., 1.0.0
    validations:
      required: true

  - type: dropdown
    id: ide
    attributes:
      label: Which AI IDE are you using?
      options:
        - Claude Code
        - Cursor
        - Windsurf
        - Copilot CLI / GitHub Copilot
        - Kilo Code
        - Other
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating System
      options: [macOS, Windows, Linux, Other]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Copy and paste any relevant log output
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Confirm
      options:
        - label: I've searched for existing issues
          required: true
        - label: I'm using the latest version
          required: false
